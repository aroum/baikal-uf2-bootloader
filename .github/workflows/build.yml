name: Build bootloader

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Baikal MCU SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/baikal-sdk
          key: baikal-sdk-linux-2.4.0-20261006

      - name: Download and extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fLk \
            https://mcu.baikalelectronics.ru/storage/files/mcu-sdk-linux_2.4.0_20261006.tar.gz \
            -o /tmp/baikal-sdk.tar.gz
          mkdir -p ~/baikal-sdk
          tar -xzf /tmp/baikal-sdk.tar.gz -C ~/baikal-sdk
          rm /tmp/baikal-sdk.tar.gz
          chmod +x ~/baikal-sdk/Tools/toolchain/bin/riscv32-none-elf-*

      - name: Build
        run: |
          make \
            SDK_DIR=$HOME/baikal-sdk \
            BUILD_TYPE=release \
            -j$(nproc)
          $HOME/baikal-sdk/Tools/toolchain/bin/riscv32-none-elf-size output/release/*.elf

      - name: Upload bootloader binary
        uses: actions/upload-artifact@v4
        with:
          name: baikal-bootloader-EVU_LI_2_1
          path: |
            output/release/*.elf
            output/release/*.bin
            output/release/*.hex
          if-no-files-found: error
          retention-days: 3
