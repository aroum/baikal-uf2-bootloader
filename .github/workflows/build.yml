name: Build bootloader

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Baikal MCU SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/baikal-sdk
          key: baikal-sdk-linux-2.4.0-20261006

      - name: Download and extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            http://mcu.baikalelectronics.ru/storage/files/mcu-sdk-linux_2.4.0_20261006.tar.gz \
            -o /tmp/baikal-sdk.tar.gz
          sudo mkdir -p /opt/baikal-sdk
          sudo tar -xzf /tmp/baikal-sdk.tar.gz -C /opt/baikal-sdk --strip-components=1
          rm /tmp/baikal-sdk.tar.gz

      - name: Mark toolchain as executable
        run: chmod +x /opt/baikal-sdk/Tools/toolchain/bin/riscv32-none-elf-*

      - name: Build
        run: |
          make \
            SDK_DIR=/opt/baikal-sdk \
            BUILD_TYPE=release \
            -j$(nproc)

      - name: Upload bootloader binary
        uses: actions/upload-artifact@v4
        with:
          name: baikal-bootloader-EVU_LI_2_1
          path: |
            output/release/*.elf
            output/release/*.bin
            output/release/*.hex
          if-no-files-found: error
          retention-days: 90
